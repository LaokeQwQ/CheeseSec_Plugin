name: repository-checks

on:
  pull_request:
    branches: [main]

# Start from no implicit token permissions. The validation job only reads the
# checked-out tree and does not need issue, package, or write privileges.
permissions: {}

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-linux.txt

      - name: Check workflow policy
        run: python scripts/check_workflow_policy.py

      - name: Install pinned validation dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --require-hashes --only-binary=:all:
          --requirement requirements-ci-linux.txt

      - name: Validate schemas and repository JSON
        run: python scripts/validate_repo.py

      - name: Validate store, OTA, sidecar and CWEDP contracts
        run: python scripts/validate_commercial_contracts.py --base-ref origin/main

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

      - name: Validate deterministic R2 publication bundle
        run: python -m unittest tests.test_publication_bundle -v

      - name: Scan repository files for secrets and release artifacts
        run: python scripts/secret_scan.py

      - name: Check repository whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- ':!LICENSE'; then
            echo 'trailing whitespace found' >&2
            exit 1
          fi
