name: repository-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Start from no implicit token permissions. The validation job only reads the
# checked-out tree and does not need issue, package, or write privileges.
permissions: {}

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-linux.txt

      - name: Check workflow policy
        run: python scripts/check_workflow_policy.py

      - name: Install pinned validation dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --require-hashes --only-binary=:all:
          --requirement requirements-ci-linux.txt

      - name: Validate schemas and repository JSON
        run: python scripts/validate_repo.py

      - name: Scan repository files for secrets and release artifacts
        run: python scripts/secret_scan.py

      - name: Check repository whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- ':!LICENSE'; then
            echo 'trailing whitespace found' >&2
            exit 1
          fi
