version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
    groups:
      github-codeql:
        patterns:
          - github/codeql-action
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Asia/Shanghai
    labels:
      - dependencies
    open-pull-requests-limit: 5
